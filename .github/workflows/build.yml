name: Build

# Every push builds Linux (.deb), Windows (.zip) and macOS (.dmg) and uploads them as run artifacts.
# A pushed `v*` tag (e.g. v1.2.0) also publishes them as a GitHub release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  linux:
    runs-on: ubuntu-22.04            # older glibc, so the .deb also installs on older distros
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Version
        shell: bash
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then v=${GITHUB_REF_NAME#v}; else v=0.0.$GITHUB_RUN_NUMBER; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build .deb
        run: packaging/build-deb.sh
      - name: Smoke test
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libxcb-cursor0 libegl1
          python packaging/smoke.py build/pyi-dist/kotodl/kotodl
      - uses: actions/upload-artifact@v7
        with:
          name: kotodl-linux
          path: dist/*.deb
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Freeze
        run: python packaging/freeze.py
      - name: Smoke test
        run: python packaging/smoke.py build/pyi-dist/kotodl/kotodl.exe
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/pyi-dist/kotodl -DestinationPath dist/kotodl-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: kotodl-windows
          path: dist/*.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest            # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Freeze
        run: python packaging/freeze.py
      - name: Smoke test
        run: python packaging/smoke.py build/pyi-dist/kotodl.app/Contents/MacOS/kotodl
      - name: Disk image
        run: |
          mkdir -p dist
          hdiutil create -volname "Anikoto Downloader" -srcfolder build/pyi-dist/kotodl.app \
            -ov -format UDZO dist/kotodl-macos-arm64.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: kotodl-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
